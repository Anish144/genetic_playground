[project]
name = "genetic-perturbation-playground"
version = "0.1.0"
description = "Playground"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "hydra-core",        # config system
    "ipywidgets>=8.1.8",
    "pertpy>=1.0.6",
    "scanpy>=1.12.1",
    "jupyterlab>=4.5.7",
    "tueplots>=0.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",  # linter + formatter
    "pytest>=8",  # testing
    "pre-commit", # git hooks
    "ipykernel",  # Jupyter support
    "nvitop",     # nicer GPU monitoring
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_perturbation_playground"]


[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", "outputs"]


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # bugbear (likely bugs)
    "SIM", # simplify
    "NPY", # numpy-specific rules
]
ignore = [
    "E501", # line-too-long — ruff format handles this
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]         # allow unused imports in __init__
"notebooks/*" = ["E402", "F401"] # notebooks are messy, accept it
