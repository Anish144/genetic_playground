# Shared RxRx1 tuning grids; inputs use training-control statistics; embedding targets stay unscaled.
kernel_grid:
  reg: [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]
  lengthscale_scale: [0.5, 1, 2, 4, 8]  # multiples of the median-heuristic lengthscale
neural:
  depth: 1
neural_grid:         # common settings; cross-fitting comes from neural
  lr: [2.5e-4, 7.5e-4, 1.5e-3]
  reg: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
  weight_decay: [1.0e-4, 1.0e-2, 1.0e-1]
  width_w: [64, 128]        # hidden units per network
  psi_size: [16, 32, 64, 128]  # output features per network
neural_variant_grids:  # added only for the selected neural model
  shared_2nn: &shared_penalties
    deviation_reg: [1.0e-6, 1.0e-4, 1.0e-2]
  hybrid:
    <<: *shared_penalties
    linear_reg: [0.0, 1.0e-4, 1.0e-3, 1.0e-2]
# Score checkpoints in one training run; every candidate trains through step 400.
neural_checkpoints: [0, 10, 20, 40, 60, 100, 150, 200, 300, 400]
