defaults:  # folds, control split, scoring and neural settings as in train_batch_transfer_expression
  - train_batch_transfer_expression
  - _self_

inner_folds: 3       # K-fold over each outer fold's training batches; settings picked by mean mse
n_configs: 20        # per bridge, drawn at random from its grid (the same draw in every fold)
# Grids for standardised expression (standardise_w, standardise_y): the bridges' ridge solutions are linear
# in Y, and Adam with decoupled weight decay ignores the loss scale, so Y's scale moves no optimum.
kernel_grid:         # 36 configurations
  reg: [1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4]
  lengthscale_scale: [0.25, 0.5, 1, 2, 4, 8]  # multiples of the median-heuristic lengthscale
neural_grid:         # 480 configurations; the rest (depth, lr, cross_fit_folds, ...) from neural
  reg: [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]
  weight_decay: [0.0, 1.0e-3, 1.0e-2, 1.0e-1]
  phi_size: [8, 16, 32, 64, 128]  # phi's hidden width and output dimension p
  psi_size: [4, 8, 16, 32]        # psi's hidden width and output dimension q
neural_checkpoints: [25, 50, 100, 200, 400]  # steps scored in one training run
