defaults:  # control split, scoring and neural settings as in train_batch_transfer_expression
  - train_batch_transfer_expression
  - _self_

inner_folds: 3       # K-fold over each outer fold's training batches; settings picked by mean mse
n_configs: 8         # per bridge, drawn at random from its grid (all of them if n_configs covers it)
# Grids for standardised expression (standardise_w, standardise_y): the bridges' ridge solutions are linear
# in Y, and Adam with decoupled weight decay ignores the loss scale, so Y's scale moves no optimum.
# Narrowed using the inner scores of an earlier run (shared phi) on 5,000 highly variable genes, not all 8,563.
kernel_grid:         # 6 configurations
  reg: [1.0e-4, 1.0e-3]
  lengthscale_scale: [1, 2, 4]  # multiples of the median-heuristic lengthscale
neural_grid:         # 8 configurations; the rest (depth, lr, cross_fit_folds, ...) from neural
  reg: [1.0e-6, 1.0e-5]
  weight_decay: [1.0e-2, 1.0e-1]
  phi_size: [64, 128]  # phi's hidden width and output dimension p
  psi_size: [16]       # psi's hidden width and output dimension q
neural_checkpoints: [100, 200, 400]  # steps scored in one training run
