# @package _global_
# Shared model schemas and links. Experiment choices live in each preset.
defaults:
  - /linear: default
  - /kernel: default
  - /neural: per_x
  - _self_

standardise_w: true
weight_by_cells: true
linear:
  standardise_w: ${standardise_w}
kernel:
  weight_by_cells: ${weight_by_cells}
neural:
  weight_by_cells: ${weight_by_cells}
  seed: ${seed}
