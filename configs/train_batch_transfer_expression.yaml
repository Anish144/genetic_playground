name: ???     # required: names the run folder, outputs/<date>/<name>_<time>/
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${name}_${now:%H-%M-%S}
n_validation_batches: 10  # distinct batches held out one at a time; one fit per model per batch
seed: 0      # selects validation batches and splits their controls reproducibly
top_k: 100    # genes used for pearson_top_k
linear_reg: 1.0e-3  # slope ridge, scaled by training cells N; 0 = ordinary least squares
bridge_reg: 1.0e-6  # ridge of both bridges, scaled by training cells N; shrinks predictions toward 0
weight_by_cells: true  # bridges weight each (perturbation, batch) mean by its cells; false = equal
bridges: [kernel, neural]  # bridge models to fit next to the linear ones; neural wants a GPU
standardise_w: true  # scale linear/bridge inputs by training-control mean/std; targets stay unscaled
neural:               # NeuralBridgeTransfer settings; see model/proxy_unconfounded_neural.py
  variant: per_x      # per_x, shared_2nn, or hybrid
  n_features_w: 32    # q, output dimension of psi (batch side)
  depth: 2
  lr: 1.0e-3
  weight_decay: 1.0e-2  # AdamW, on the weights of the control networks
  n_steps: 200        # full-batch AdamW steps per fold
  cross_fit_folds: 5  # control networks trained on a 5-fold cross-fitted loss over batches; 0 = in-sample
  device: cuda        # cpu works but is slow at this size; not mps (float64)
