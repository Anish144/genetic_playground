name: ???     # required: names the run folder, outputs/<date>/<name>_<time>/
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${name}_${now:%H-%M-%S}
n_folds: 5   # K-fold over batches; each batch is held out exactly once
seed: 0      # shuffles batches into folds
top_k: 20    # genes used for pearson_top_k
bridge_reg: 1.0e-6  # ridge of both bridges, scaled by training cells N; shrinks predictions toward 0
weight_by_cells: true  # bridges weight each (perturbation, batch) mean by its cells; false = equal
bridges: [kernel, neural]  # bridge models to fit next to the linear ones; neural wants a GPU
neural:               # NeuralBridgeTransfer settings; see model/proxy_unconfounded_neural.py
  n_features: 32      # p, output dimension of phi (perturbation side)
  n_features_w: 32    # q, output dimension of psi (batch side); cost grows with (p q)^2
  width_x: 64         # hidden units of phi; psi's width_w defaults to 64
  depth: 2
  lr: 1.0e-3
  weight_decay: 1.0e-2  # AdamW, on the weights of phi and psi
  n_steps: 200        # full-batch AdamW steps per fold
  cross_fit_folds: 5  # phi, psi trained on a 5-fold cross-fitted loss over batches; 0 = in-sample
  device: cuda        # cpu works but is slow at this size; not mps (float64)
