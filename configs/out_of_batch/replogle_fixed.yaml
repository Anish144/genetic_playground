# @package _global_
# Out-of-batch prediction with fixed settings (no tuning).
defaults:
  - /common
  - _self_

# Evaluation
seed: 0
n_validation_batches: 10  # distinct batches held out one at a time
top_k: 100  # genes used for pearson_top_k

# Models (linear baselines always run)
bridges: [kernel, neural]
neural:
  n_features_w: 32
  width_w: 64
  reg: 1.0e-6
  weight_decay: 1.0e-2
  n_steps: 200
  cross_fit_folds: 5
  device: cuda

# Execution
name: ???
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${name}_${now:%H-%M-%S}
