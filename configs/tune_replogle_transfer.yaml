defaults:  # control split, scoring and neural settings as in train_replogle_transfer
  - train_replogle_transfer
  - _self_

inner_folds: 3       # K-fold over each outer fold's training batches; settings picked by mean mse
n_configs: 32        # sampled neural configurations; covers all 20 kernel configurations
# Inputs use training-control statistics; expression targets stay unscaled.
kernel_grid:
  reg: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
  lengthscale_scale: [0.5, 1, 2, 4]  # multiples of the median-heuristic lengthscale
neural:
  depth: 1
neural_grid:         # common settings; cross-fitting comes from neural
  lr: [3.0e-5, 1.0e-4, 3.0e-4, 7.5e-4]
  reg: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]
  weight_decay: [1.0e-4, 1.0e-2, 1.0e-1]
  width_w: [32, 64, 128]  # hidden units per network
  psi_size: [8, 16, 32]  # output features per network
neural_variant_grids:  # added only for the selected neural model
  shared_2nn: &shared_penalties
    deviation_reg: [1.0e-6, 1.0e-4, 1.0e-2]
  hybrid:
    <<: *shared_penalties
    linear_reg: [0.0, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
# Score checkpoints in one training run; every candidate trains through step 400.
neural_checkpoints: [0, 1, 2, 4, 8, 16, 32, 50, 100, 200, 400]
