defaults:  # tune_replogle_transfer with a separate A_x per perturbation, only psi shared
  - tune_replogle_transfer
  - override /neural: per_x
  - _self_

n_configs: 16       # all neural configurations
neural_grid:
  lr: [1.0e-4, 7.5e-4]
  reg: [1.0e-5, 1.0e-4]
  weight_decay: [1.0e-4]
  width_w: [32, 64]    # psi hidden width
  psi_size: [8, 16]    # psi output dimension q
neural_checkpoints: [0, 1, 2, 4, 8, 16, 32, 50]
