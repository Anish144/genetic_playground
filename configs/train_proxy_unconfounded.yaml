n_envs: [5, 10, 20, 40]            # number of source environments D (sweep)
proxies: [identity]   # W = g(U2) + noise; see data/proxy_unconfounded.PROXIES
theta_targets: [-2.5, -1.0, 0.5, 1.8, 2.5]  # target latent means; sources use Uniform(-2, 2)
n_seeds: 10
n: 200                # (X, Y) pairs per source environment
m: 200                # proxies W per environment, also for the target
n_target_labels: 4000 # labelled target pairs for the oracle (= pooled source size at D=20)
n_grid: 200           # x grid on [-3, 3] where MSE against the true E[Y | x, e*] is computed
lengthscale_x: 1.0
lengthscale_w: 1.0
reg: 1.0e-3
