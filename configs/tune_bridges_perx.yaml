defaults:  # tune_bridges with a separate A_x per perturbation, only psi shared
  - tune_bridges
  - _self_

n_configs: 10       # all combinations of ridge, weight decay, hidden width and output dimension
neural:
  per_perturbation: true
neural_grid:         # 108 configurations
  reg: [1.0e-5, 1.0e-4, 1e-3]
  weight_decay: [1.0e-5, 1.0e-4, 1e-6]
  phi_size: [8]        # unused: phi is the identity
  width_w: [64, 128, 256]  # psi hidden width
  psi_size: [8, 16, 32]       # psi output dimension q
neural_checkpoints: [50, 100, 150, 200]
