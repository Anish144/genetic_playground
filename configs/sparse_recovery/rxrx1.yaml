# @package _global_
# Tune using retained responses, then recover the full equal-batch mean.
defaults:
  - /common
  - /search_spaces/rxrx1
  - _self_

# Data
cell_type: HUVEC
batch_unit: plate
proxy_controls: positive
embeddings:
  grid: 4
  standardise_sites: false

# Evaluation and tuning
seed: 0
n_seeds: 5
k_values: [2, 3, 4, 5]  # retained response batches per perturbation
n_configs: 20  # candidates per bridge and data seed; reuse across k
hp_sampling_seed: null  # offset added to the data seed; null means zero

# Models
bridges: [neural]
include_linear: true  # also compare pooled, shift, diagonal and full linear averages
neural:
  depth: 1
  n_features_w: 32
  width_w: 128
  reg: 1.0e-6
  weight_decay: 1.0e-2
  n_steps: 200  # tuning selects a step from neural_checkpoints
  cross_fit_folds: 0  # k=2 inner fits retain one response batch per perturbation
  gene_block_size: 384
  device: cuda

# Sparse-only search space, from the 20 Nov Beaker runs (no cross-fitting, before
# the ||A||^2 training penalty). Winners sat at grid edges and never trained past
# 40 steps; penalties extend upward because they now also act during training.
neural_grid:
  lr: [1.0e-4, 2.5e-4, 7.5e-4]
  reg: [1.0e-4, 1.0e-3, 1.0e-2]
  weight_decay: [1.0e-5, 1.0e-4, 1.0e-2]
  width_w: [128, 256]
  psi_size: [16, 32, 64, 128]
neural_variant_grids:
  shared_2nn:
    deviation_reg: [1.0e-2, 1.0e-1, 1.0]
  hybrid:
    deviation_reg: [1.0e-2, 1.0e-1, 1.0]
    linear_reg: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
neural_checkpoints: [0, 5, 10, 20, 40, 60, 100]

# Execution
name: ???
output_dir: outputs/rxrx1_sparse_recovery/${name}
resume: true
wandb_mode: disabled
hydra:
  run:
    dir: ${output_dir}/logs/${now:%Y-%m-%d_%H-%M-%S_%f}
