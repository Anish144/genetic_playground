defaults:
  - transfer_defaults
  - rxrx1_tuning_grid
  - _self_

name: ???
output_dir: outputs/rxrx1_sparse_recovery/${name}
resume: true
include_linear: false  # also compare pooled, shift, diagonal and full linear virtual averages
n_seeds: 10
k_values: [2, 3, 4]
n_configs: 8  # fresh draw per bridge and data seed; reuse across k
hp_sampling_seed: null  # offset: draw RNG = data seed + offset; null means zero
cell_type: HUVEC
batch_unit: plate
proxy_controls: positive
embeddings:
  grid: 4
  standardise_sites: false
wandb_mode: disabled
neural:
  width_w: 128
  gene_block_size: 384
  cross_fit_folds: 0  # k=2 inner fits have one retained response batch per perturbation
hydra:
  run:
    dir: ${output_dir}/logs/${now:%Y-%m-%d_%H-%M-%S_%f}
