name: ???     # required: names the run folder, outputs/<date>/<name>_<time>/
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${name}_${now:%H-%M-%S}
cell_type: HUVEC    # one cell type per run; HUVEC has the most experiments (24)
n_folds: 5          # K-fold over experiments; each experiment is held out exactly once
seed: 0             # shuffles experiments into folds
whiten_eps: 1.0e-3  # eigenvalue floor of the metric's whitening, relative to the mean eigenvalue
positive_controls_as_proxies: false  # proxy W = negative controls; true adds the positive controls
bridge_reg: 1.0e-6  # ridge of both bridges, scaled by training crops N
weight_by_cells: true  # bridges weight each (siRNA, experiment) mean by its crops; false = equal
bridges: [kernel, neural]  # bridge models to fit next to the linear ones and TVN; neural wants a GPU
wandb_mode: online  # one W&B run per job, named name, with each fold's neural bridge loss; offline or disabled
neural:               # NeuralBridgeTransfer settings; see model/proxy_unconfounded_neural.py
  n_features: 128      # p, output dimension of phi (perturbation side)
  n_features_w: 32    # q, output dimension of psi (batch side); cost grows with (p q)^2
  width_x: 128        # hidden units of phi
  width_w: 128        # hidden units of psi
  depth: 2
  lr: 1.0e-3
  weight_decay: 1.0e-2  # AdamW, on the weights of phi and psi
  n_steps: 200        # full-batch AdamW steps per fold
  cross_fit_folds: 5  # phi, psi trained on a 5-fold cross-fitted loss over batches; 0 = in-sample
  device: cuda        # cpu works but is slow at this size; not mps (float64)
  log_key: null       # W&B key prefix of the loss, null = not logged; scripts set "fold <k>/neural bridge"
